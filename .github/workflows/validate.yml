name: Validate Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate plugin.json
        run: |
          if ! jq . plugin.json > /dev/null 2>&1; then
            echo "plugin.json is not valid JSON"
            exit 1
          fi
          echo "plugin.json is valid"

      - name: Validate agent registry
        run: |
          if ! jq . subagents/registry.json > /dev/null 2>&1; then
            echo "registry.json is not valid JSON"
            exit 1
          fi
          echo "registry.json is valid"

      - name: Check agent files exist
        run: |
          MISSING=0
          while IFS= read -r file; do
            if [ ! -f "subagents/$file" ]; then
              echo "Missing agent file: subagents/$file"
              MISSING=$((MISSING + 1))
            fi
          done < <(jq -r '.categories | to_entries[] | .value.agents[].file' subagents/registry.json)

          if [ $MISSING -gt 0 ]; then
            echo "$MISSING agent files are missing"
            exit 1
          fi
          echo "All agent files exist"

      - name: Validate agent frontmatter
        run: |
          ERRORS=0
          for file in subagents/*/*.md; do
            if [ -f "$file" ]; then
              if ! head -1 "$file" | grep -q "^---$"; then
                echo "Missing frontmatter in: $file"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "$ERRORS agents have invalid frontmatter"
            exit 1
          fi
          echo "All agents have valid frontmatter"

      - name: Check JavaScript syntax
        run: |
          for file in hooks/*.js skills/*.js mcp/*.js; do
            if [ -f "$file" ]; then
              if ! node --check "$file" 2>/dev/null; then
                echo "Syntax error in: $file"
                exit 1
              fi
            fi
          done
          echo "All JavaScript files have valid syntax"

      - name: Count agents
        run: |
          TOTAL=$(find subagents -name "*.md" -not -name "maestro.md" | wc -l)
          echo "Total agents: $TOTAL"

  test-mcp:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test MCP server initialization
        run: |
          timeout 5 node mcp/server.js < /dev/null || true
          echo "MCP server initialization test passed"
